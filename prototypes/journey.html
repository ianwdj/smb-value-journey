<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SMB value-realization: full journey prototype</title>
<link rel="stylesheet" href="../assets/gpt-ui.css"/>
<style>
  /* All colors come from gpt-ui.css dark tokens. No hardcoded near-black text. Theme is locked dark. */
  body.gpt { padding-bottom:64px; } /* room for the demo nav bar */
  .stage { min-height:calc(100vh - 64px); }
  .center { max-width:760px; margin:0 auto; padding:6vh 20px 40px; }
  .brandmark { width:30px; height:30px; border-radius:50%; border:1px solid var(--border-2); display:grid; place-items:center; color:var(--text); }
  svg.ic { display:block; }

  /* demo navigator */
  .nav { position:fixed; left:0; right:0; bottom:0; height:56px; background:var(--sidebar-bg); border-top:1px solid var(--border);
    display:flex; align-items:center; gap:14px; padding:0 16px; z-index:60; }
  .nav .label { color:var(--text-2); font-size:13px; }
  .nav .dots { display:flex; gap:6px; margin:0 auto; }
  .nav .dot { width:7px; height:7px; border-radius:50%; background:var(--border-2); }
  .nav .dot.on { background:var(--accent); }
  .nav button { font:inherit; }

  /* checkout */
  .checkout { display:grid; grid-template-columns:1.15fr .85fr; gap:26px; max-width:940px; margin:2vh auto; padding:0 20px; }
  @media(max-width:820px){ .checkout{ grid-template-columns:1fr; } }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .seg .opt { border:1px solid var(--border-2); border-radius:12px; padding:12px 14px; cursor:pointer; }
  .seg .opt.sel { border-color:var(--text); }
  .stepfield { border:1px solid var(--border-2); border-radius:12px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; }
  .stepbtn { width:30px; height:30px; border-radius:8px; border:1px solid var(--border-2); background:transparent; color:var(--text); cursor:pointer; font-size:18px; }
  .save { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--accent); background:var(--accent-soft); border-radius:12px; padding:12px 14px; margin-top:12px; }
  .save .badge { color:var(--accent); }
  .summary .line { display:flex; justify-content:space-between; margin:7px 0; color:var(--text-2); }
  .summary .due { display:flex; justify-content:space-between; font-weight:700; color:var(--text); font-size:18px; margin-top:6px; }

  /* plan cards */
  .plans { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media(max-width:820px){ .plans{ grid-template-columns:1fr; } }
  .plan { border:1px solid var(--border-2); border-radius:14px; padding:18px; background:var(--bg-elev); }
  .plan.sel { border-color:var(--text); }
  .plan h3 { margin:0 0 4px; }
  .plan .feat { color:var(--text-2); font-size:13.5px; margin:8px 0; }

  /* spinner */
  .spin { width:32px; height:32px; border:3px solid var(--border-2); border-top-color:var(--text); border-radius:50%; animation:r 1s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }

  /* editable profile */
  .editrow { display:grid; grid-template-columns:110px 1fr; gap:10px; align-items:center; margin:9px 0; }
  .editrow input, .editrow select { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--border-2); background:var(--bg); color:var(--text); }

  /* starter / proactive */
  .start { border:1px solid var(--border-2); border-radius:14px; padding:16px; display:flex; justify-content:space-between; gap:14px; align-items:center; background:var(--bg-elev); }
  .proactive { border:1px solid var(--border-2); border-radius:14px; background:var(--bg-elev); padding:16px; margin:12px 0; }
  .proactive .eyebrow { color:var(--accent); font-weight:600; font-size:12px; }

  /* connectors / consent */
  .conn-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media(max-width:620px){ .conn-grid{ grid-template-columns:1fr; } }
  .conn { display:flex; align-items:center; gap:12px; border:1px solid var(--border-2); border-radius:12px; padding:14px; background:var(--bg-elev); }
  .conn .logo { width:36px; height:36px; border-radius:9px; background:var(--hover); color:var(--text-2); display:grid; place-items:center; font-weight:600; font-size:13px; flex:none; }
  .consent { max-width:460px; margin:6vh auto; border:1px solid var(--border-2); border-radius:16px; background:var(--bg-elev); padding:22px; }
  .scope { display:flex; gap:10px; align-items:flex-start; margin:10px 0; color:var(--text-2); font-size:14px; }
  .scope .tick { color:var(--accent); flex:none; }

  /* admin cohort */
  .cohort { height:30px; border-radius:8px; display:flex; overflow:hidden; border:1px solid var(--border); }
  .cohort span { display:grid; place-items:center; font-size:11px; color:var(--bg); font-weight:600; }
  .legend { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; font-size:13px; color:var(--text-2); }
  .swatch { width:11px; height:11px; border-radius:3px; display:inline-block; margin-right:7px; vertical-align:middle; }

  .recap { display:grid; gap:8px; margin-top:14px; }
  .recap div { display:flex; gap:10px; align-items:center; color:var(--text-2); }
  .recap .n { width:24px; height:24px; border-radius:50%; border:1px solid var(--border-2); display:grid; place-items:center; font-size:12px; color:var(--text); flex:none; }
  .hidden { display:none; }
</style>
</head>
<body class="gpt dark">
<div id="app"></div>

<div class="nav">
  <button class="btn secondary" id="backBtn" onclick="prev()">Back</button>
  <div class="dots" id="dots"></div>
  <span class="label" id="navlabel"></span>
  <button class="btn" id="nextBtn" onclick="next()">Next</button>
</div>
<div class="proto-flag">Prototype. Design exploration, not a shipped product.</div>

<script>
/* ---------- shared shell + icons (SVG, no glyphs) ---------- */
const I = {
  plus:'<svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  send:'<svg class="ic" width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 16.5V8m-3.5 3.5L12 8l3.5 3.5" fill="none" stroke="var(--bg-elev)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev:'<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  mark:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a4 4 0 013.9 5 4 4 0 01-1 7 4 4 0 01-5.8 0 4 4 0 01-1-7A4 4 0 0112 3z"/></svg>',
  tick:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
};
let savedTool = false;
function sidebarItems(){
  return `<div class="nav-item active">New stock cleanup</div>
    <div class="nav-item">Quote from supplier email</div>
    ${savedTool?'<div class="nav-item" style="color:var(--accent)">Weekly stock cleanup (saved)</div>':''}`;
}
function shell(main){
  return `<div class="gpt-app">
    <aside class="gpt-sidebar">
      <div class="brand"><span class="brandmark">${I.mark}</span> Rivera Signs</div>
      <div class="newchat">${I.plus} New chat</div>
      <div class="section-label">Recent</div>
      ${sidebarItems()}
      <div class="spacer"></div>
      <div class="acct"><span class="avatar">IR</span><div style="font-size:13px"> In&eacute;s Rivera<br><span class="muted small">Business workspace</span></div></div>
    </aside>
    <main class="gpt-main">
      <div class="gpt-topbar"><div class="model">ChatGPT 5 <span class="chev">${I.chev}</span></div></div>
      <div class="gpt-scroll">${main}</div>
    </main>
  </div>`;
}
function userMsg(t){ return `<div class="msg user"><div class="bubble">${t}</div></div>`; }
function aiMsg(t){ return `<div class="msg assistant"><span class="assistant-mark">${I.mark}</span><div class="body">${t}</div></div>`; }
function composer(ph){ return `<div class="composer-wrap"><div class="composer"><button class="icon-btn">${I.plus}</button><textarea class="ta" rows="1" placeholder="${ph||'Message ChatGPT'}"></textarea><button class="icon-btn send">${I.send}</button></div><div class="composer-hint">Prototype. You can also use the left nav to move around.</div></div>`; }

/* ---------- steps ---------- */
const STEPS = [
{ name:'Sign in', render:()=>`<div class="stage"><div class="center" style="text-align:center;max-width:420px">
  <span class="brandmark" style="margin:0 auto 18px">${I.mark}</span>
  <h1 style="font-size:26px;font-weight:600">Create your workspace</h1>
  <p class="muted">Start with your work email. We use it to set you up, not to spam you.</p>
  <div class="field" style="text-align:left;margin-top:18px"><label>Work email</label><input id="email" value="ines@riverasigns.com"/></div>
  <button class="btn block" onclick="next()">Continue</button>
</div></div>` },

{ name:'Choose a plan', render:()=>`<div class="stage"><div class="center">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="brandmark">${I.mark}</span><strong>Upgrade your plan</strong></div>
  <div class="seg" style="max-width:300px"><div class="opt" id="pPers" onclick="selPlanType('pers')">Personal</div><div class="opt sel" id="pBus" onclick="selPlanType('bus')">Business</div></div>
  <div class="plans">
    <div class="plan"><h3>Plus</h3><div class="muted">$20 / month</div><div class="feat">For one person. Advanced models, projects, Codex.</div><button class="btn secondary block" disabled>Current plan</button></div>
    <div class="plan sel"><h3>Business</h3><div class="muted">from $25 / seat / mo</div><div class="feat">For your team. SSO, projects, SharePoint, admin controls.</div><button class="btn block" onclick="next()">Choose Business</button></div>
    <div class="plan"><h3>Business Codex</h3><div class="muted">Usage pricing</div><div class="feat">For software teams. No fixed seat fee, pay as you go based on usage.</div><button class="btn secondary block">Add workspace</button></div>
  </div>
  <p class="muted small" style="margin-top:14px">Business seats are billed per seat; Codex is consumption-based. The two pricing models coexist.</p>
</div></div>` },

{ name:'Configure & pay', render:()=>`<div class="stage"><div class="checkout">
  <div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span class="brandmark">${I.mark}</span><strong>Configure your plan</strong></div>
    <div class="seg">
      <div class="opt sel" id="bMo" onclick="bill('mo')"><strong>Monthly</strong><div class="muted small">$25 seat/mo</div></div>
      <div class="opt" id="bYr" onclick="bill('yr')"><strong>Annual</strong> <span class="badge green">save 20%</span><div class="muted small">$20 seat/mo</div></div>
    </div>
    <label class="small muted">Seats</label>
    <div class="stepfield"><div style="display:flex;gap:10px;align-items:center"><button class="stepbtn" onclick="seats(-1)">-</button><strong id="seatN" style="font-size:18px">2</strong><button class="stepbtn" onclick="seats(1)">+</button></div><span class="muted small" id="seatHint">Most teams your size start with 2. Change anytime.</span></div>
    <h3 style="margin-top:18px">Payment</h3>
    <div class="field"><label>Card number</label><input placeholder="Card number"/></div>
    <div class="grid cols-2"><div class="field"><label>Expiry</label><input placeholder="MM / YY"/></div><div class="field"><label>CVC</label><input placeholder="CVC"/></div></div>
    <div class="save"><span class="badge">${I.tick}</span><div><strong>Save card for renewals</strong><div class="muted small">On usage-based plans, a saved card keeps value flowing without a re-auth interruption.</div></div></div>
    <button class="btn block" id="payBtn" style="margin-top:14px" onclick="pay()">Subscribe</button>
    <div class="muted small" style="margin-top:8px">One clear action. Cancel anytime in Settings.</div>
  </div>
  <div class="panel summary">
    <h3>Business plan</h3><div class="muted small">Advanced models, SSO, projects, SharePoint.</div><hr class="divider"/>
    <div class="line"><span id="sLine">2 seats, monthly</span><span id="sSub">$50.00</span></div>
    <div class="line"><span>Tax</span><span>$0.00</span></div>
    <div class="due"><span>Due today</span><span id="sDue">$50.00</span></div>
  </div>
</div></div>` },

{ name:'Workspace ready', render:()=>`<div class="stage"><div class="center" style="text-align:center;max-width:440px">
  <span class="badge green" style="margin-bottom:12px">${I.tick} Payment successful</span>
  <h1 style="font-size:24px;font-weight:600">Your workspace is ready</h1>
  <p class="muted">Invite teammates now, or skip and do it later.</p>
  <div class="field" style="text-align:left;margin-top:16px"><label>Invite by email (optional)</label><input placeholder="teammate@riverasigns.com"/></div>
  <div style="display:flex;gap:10px;justify-content:center"><button class="btn" onclick="next()">Send & continue</button><button class="btn secondary" onclick="next()">Skip for now</button></div>
</div></div>` },

{ name:'Setting up', render:()=>shell(`<div class="thread"><div style="text-align:center;padding:8vh 0">
  <div class="spin" style="margin:0 auto 16px"></div>
  <h2 style="font-weight:600">Setting up your workspace</h2>
  <p class="muted">Looking up <strong>ines@riverasigns.com</strong> so we can suggest where to start, instead of a blank page.</p>
  <p class="muted small">Public business signals only. Nothing private was read, nothing connected.</p>
</div></div>`), auto:true },

{ name:'What we found', render:()=>shell(`<div class="thread">${aiMsg(`<p><strong>Here is what we found.</strong> You can correct any of it.</p>
  <div class="panel" style="margin-top:6px">
    <div class="editrow"><label class="muted">Company</label><input value="Rivera Signs"/></div>
    <div class="editrow"><label class="muted">Role</label><input value="Operations / owner"/></div>
    <div class="editrow"><label class="muted">Industry</label><select><option>Sign &amp; print manufacturing</option><option>Legal services</option><option>Field service</option></select></div>
    <div class="muted small" style="margin-top:6px">Based on public signals. Nothing connected yet.</div>
    <button class="btn" style="margin-top:12px" onclick="next()">Looks right, continue</button>
  </div>`)}</div>`) },

{ name:'Where to start', render:()=>shell(`<div class="thread">
  ${aiMsg(`<p>Most sign &amp; print operators start here. One step, not a menu.</p>
    <div class="start" style="margin-top:6px"><div><strong>Clean up a stock or order spreadsheet</strong><div class="muted small">Turn a messy export into a clean report in one pass.</div></div><button class="btn" onclick="next()">Start this</button></div>
    <div style="margin-top:10px"><button class="btn ghost" onclick="next()">Skip, I'll explore on my own</button></div>
    <p class="muted small" style="margin-top:10px">You can also just type below, or use the left nav. This is a recommendation, not a wall.</p>`)}
</div>${composer('Ask anything, or tell me what you are working on')}`) },

{ name:'First value', render:()=>shell(`<div class="thread">
  ${userMsg('Cleaned up the weekly stock sheet again (18,000 rows to 900).')}
  ${aiMsg('Done. 18,000 rows to 900 in one pass.')}
  <div class="proactive">
    <div class="eyebrow">Noticed a pattern</div>
    <p style="margin:6px 0">You have done this cleanup four weeks running. Want me to save it as a one-click tool so you do not rebuild it each time?</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="acceptTool()">Save as a tool</button><button class="btn secondary" onclick="next()">Not now</button></div>
    <div id="toolDone" class="hidden" style="margin-top:12px"><span class="badge green">${I.tick} Saved to your sidebar</span> <span class="badge">~3 hrs saved / month, from your last 4 weeks</span>
      <div style="margin-top:10px"><button class="btn secondary" onclick="next()">Run it on this week's export</button></div></div>
  </div>
</div>${composer()}`) },

{ name:'Connect a system', render:()=>shell(`<div class="thread">
  ${aiMsg(`<p>To go further, connect a system. We ask for read-only access and show you exactly what we read.</p>
    <div class="conn-grid" style="margin-top:8px" id="connGrid">
      <div class="conn" style="cursor:pointer" onclick="consent('QuickBooks')"><span class="logo">QB</span><div style="flex:1"><strong>QuickBooks</strong><div class="muted small">Invoices, customers</div></div><button class="btn secondary" onclick="consent('QuickBooks')">Connect</button></div>
      <div class="conn" style="cursor:pointer" onclick="consent('Google Drive')"><span class="logo">GD</span><div style="flex:1"><strong>Google Drive</strong><div class="muted small">Sheets, docs</div></div><button class="btn secondary" onclick="consent('Google Drive')">Connect</button></div>
      <div class="conn" style="cursor:pointer" onclick="consent('HubSpot')"><span class="logo">HS</span><div style="flex:1"><strong>HubSpot</strong><div class="muted small">Contacts, deals</div></div><button class="btn secondary" onclick="consent('HubSpot')">Connect</button></div>
      <div class="conn" style="cursor:pointer" onclick="consent('SharePoint')"><span class="logo">SP</span><div style="flex:1"><strong>SharePoint</strong><div class="muted small">Files</div></div><button class="btn secondary" onclick="consent('SharePoint')">Connect</button></div>
    </div>`)}
</div>`) },

{ name:'Suggested playbooks', render:()=>shell(`<div class="thread">
  ${aiMsg(`<p><strong>From your QuickBooks data, here is what we see and what to run.</strong></p>
    <div class="start" style="margin-top:6px"><div><strong>Chase overdue invoices</strong><div class="muted small">12 invoices over 30 days. Draft polite reminders for your approval.</div></div><button class="btn" onclick="this.textContent='Set up'">Set up</button></div>
    <div class="start" style="margin-top:10px"><div><strong>Weekly cash summary</strong><div class="muted small">A Monday summary of what came in and what is owed.</div></div><button class="btn secondary" onclick="this.textContent='Set up'">Set up</button></div>
    <p class="muted small" style="margin-top:10px">Each runs on your approval first. Nothing sends on its own.</p>`)}
</div>`) },

{ name:'Admin: health', render:()=>`<div class="stage"><div class="center" style="max-width:900px">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px"><span class="brandmark">${I.mark}</span><strong>Consumption health</strong> <span class="badge">internal</span></div>
  <p class="muted small">How the team behind the engine sees an account base. Decline is visible before churn.</p>
  <div class="panel" style="margin-top:14px">
    <div class="eyebrow" style="margin-bottom:8px">Share of portfolio by trajectory</div>
    <div class="cohort">
      <span style="width:34%;background:var(--accent)">Growing 34%</span>
      <span style="width:30%;background:#6b7280">Stable 30%</span>
      <span style="width:22%;background:var(--warn)">Declining 22%</span>
      <span style="width:14%;background:#d97757">Faded 14%</span>
    </div>
    <div class="legend">
      <div><span class="swatch" style="background:var(--accent)"></span>Growing: breadth and depth rising</div>
      <div><span class="swatch" style="background:#6b7280"></span>Stable: one durable workflow</div>
      <div><span class="swatch" style="background:var(--warn)"></span>Silently declining: no cancel event would fire</div>
      <div><span class="swatch" style="background:#d97757"></span>Novelty then faded: failed the persistence test</div>
    </div>
    <hr class="divider"/>
    <div class="muted small">A workflow counts only if it recurs (3 runs / 14 days), persists across two windows, and ties to a user outcome, measured treated minus a randomized holdout.</div>
  </div>
</div></div>` },

{ name:'Recap', render:()=>`<div class="stage"><div class="center" style="text-align:center;max-width:520px">
  <span class="brandmark" style="margin:0 auto 14px">${I.mark}</span>
  <h1 style="font-size:24px;font-weight:600">That is the full journey</h1>
  <p class="muted">From first setup to durable value, then expansion, then the internal view that measures it.</p>
  <div class="recap" style="text-align:left;max-width:420px;margin:18px auto 0">
    <div><span class="n">1</span> A silent research agent replaces the blank page</div>
    <div><span class="n">2</span> One recommended start, not a menu</div>
    <div><span class="n">3</span> The agent pushes the next workflow in context</div>
    <div><span class="n">4</span> Connect a system with real consent and scopes</div>
    <div><span class="n">5</span> Playbooks from connected data, on approval</div>
    <div><span class="n">6</span> An internal view that catches silent decline</div>
  </div>
  <button class="btn" style="margin-top:20px" onclick="go(0)">Restart</button>
</div></div>` },
];
STEPS.splice(0,4); // journey starts at "Setting up"; signup, plan, checkout, and workspace-ready removed

/* ---------- router ---------- */
let i = 0;
function render(){
  document.getElementById('app').innerHTML = STEPS[i].render();
  document.getElementById('navlabel').textContent = `Step ${i+1} of ${STEPS.length} · ${STEPS[i].name}`;
  document.getElementById('backBtn').disabled = i===0;
  document.getElementById('nextBtn').disabled = i===STEPS.length-1;
  const dots = STEPS.map((_,k)=>`<span class="dot ${k===i?'on':''}"></span>`).join('');
  document.getElementById('dots').innerHTML = dots;
  window.scrollTo(0,0);
  if(STEPS[i].auto){ const cur=i; setTimeout(()=>{ if(i===cur) next(); }, 1600); }
}
function next(){ if(i<STEPS.length-1){ i++; render(); } }
function prev(){ if(i>0){ i--; render(); } }
function go(n){ i=n; render(); }

/* ---------- step interactions ---------- */
let billMode='mo', n=2;
function selPlanType(t){ document.getElementById('pPers').classList.toggle('sel',t==='pers'); document.getElementById('pBus').classList.toggle('sel',t==='bus'); }
function bill(m){ billMode=m; document.getElementById('bMo').classList.toggle('sel',m==='mo'); document.getElementById('bYr').classList.toggle('sel',m==='yr'); sumSync(); }
function seats(d){ n=Math.max(1,n+d); document.getElementById('seatN').textContent=n; document.getElementById('seatHint').textContent = n<=2?'Most teams your size start with 2. Change anytime.':'Billing follows active seats; add or remove anytime.'; sumSync(); }
function sumSync(){ const p=billMode==='mo'?25:20; const sub=(n*p).toFixed(2); document.getElementById('sLine').textContent=`${n} seats, ${billMode==='mo'?'monthly':'annual'}`; document.getElementById('sSub').textContent='$'+sub; document.getElementById('sDue').textContent='$'+sub; }
function pay(){ const b=document.getElementById('payBtn'); b.textContent='Processing...'; b.disabled=true; setTimeout(next,900); }
function acceptTool(){ savedTool=true; document.getElementById('toolDone').classList.remove('hidden'); }
function consent(name){
  const target = document.getElementById('connGrid') || document.getElementById('app');
  target.innerHTML = `<div class="panel" style="margin-top:8px">
    <div style="display:flex;align-items:center;gap:10px"><span class="brandmark">${I.mark}</span><strong>Connect ${name}</strong></div>
    <p class="muted small" style="margin-top:8px">ChatGPT is requesting access to your ${name} account (ines@riverasigns.com).</p>
    <div class="scope"><span class="tick">${I.tick}</span><div><strong>Read-only.</strong> View invoices, customers, and totals.</div></div>
    <div class="scope"><span class="tick">${I.tick}</span><div>No write access. ChatGPT cannot edit or send anything in ${name}.</div></div>
    <div class="scope"><span class="tick">${I.tick}</span><div>Revocable anytime in Settings. Every read is logged.</div></div>
    <div style="display:flex;gap:10px;margin-top:12px"><button class="btn" onclick="next()">Allow read-only access</button><button class="btn secondary" onclick="render()">Cancel</button></div>
    <p class="muted small" style="margin-top:10px">This is the consent step a real connector requires. No silent one-click connect.</p>
  </div>`;
}
render();
</script>
</body>
</html>
