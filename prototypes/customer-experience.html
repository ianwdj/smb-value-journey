<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customer Experience — Customer Lifecycle Agent</title>
<link rel="stylesheet" href="styles.css?v=4" />
<style>
/* ===================== Screen 2 — customer in-product ===================== */
.s2-root { display: flex; height: 100%; overflow: hidden; }

/* ---- sidebar ---- */
.s2-side { width: 264px; flex: none; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; }
.s2-side-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 10px; }
.s2-brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; }
.s2-logo { width: 19px; height: 19px; border-radius: 6px; background: var(--text);
  -webkit-mask: radial-gradient(circle at 50% 50%, transparent 31%, #000 32%) ; mask: none;
  background: conic-gradient(from 0deg, var(--text), var(--text)); position: relative; }
.s2-logo::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); }
.s2-logo.sm { width: 16px; height: 16px; }
.s2-logo.sm::after { inset: 4px; background: var(--surface-2); }
.s2-logo.lg { width: 30px; height: 30px; }
.s2-logo.lg::after { inset: 8px; background: var(--bg); }
.s2-icon-btn { background: transparent; border: none; color: var(--text-3); border-radius: 7px; padding: 5px; display: inline-flex; }
.s2-icon-btn:hover { background: var(--hover); color: var(--text); }

.s2-side-scroll { flex: 1; overflow-y: auto; padding: 4px 8px 10px; }
.s2-new { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; font-size: 14px; font-weight: 500; cursor: pointer; }
.s2-new:hover { background: var(--hover); }
.s2-nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; font-size: 14px; color: var(--text-2); cursor: pointer; }
.s2-nav:hover { background: var(--hover); color: var(--text); }
.s2-nav.on { background: var(--hover); color: var(--text); }
.s2-badge { margin-left: auto; font-size: 11px; color: var(--text-3); }

.s2-section-label { font-size: 11.5px; font-weight: 500; color: var(--text-3); text-transform: none; letter-spacing: .02em; padding: 16px 10px 6px; }
.s2-wf { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; cursor: pointer; }
.s2-wf:hover { background: var(--hover); }
.s2-wf svg { color: var(--text-2); flex: none; }
.s2-wf-meta { display: flex; flex-direction: column; min-width: 0; }
.s2-wf-name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s2-wf-sub { font-size: 12px; color: var(--text-3); }
.s2-wf-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--accent); margin-left: auto; flex: none; }
.s2-wf-empty { font-size: 12.5px; color: var(--text-3); padding: 6px 10px; }
.s2-chat { font-size: 13.5px; color: var(--text-2); padding: 8px 10px; border-radius: 9px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s2-chat:hover { background: var(--hover); color: var(--text); }
.s2-chat.on { background: var(--hover); color: var(--text); }

.s2-side-foot { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border); }
.s2-avatar { width: 28px; height: 28px; border-radius: 999px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; }
.s2-acct { display: flex; flex-direction: column; min-width: 0; }
.s2-acct-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s2-acct-plan { font-size: 11.5px; color: var(--text-3); }

/* ---- main ---- */
.s2-main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.s2-topbar { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--border); flex: none; padding-right: 230px; }
.s2-topbar-title { font-size: 14px; font-weight: 500; color: var(--text-2); }
.s2-entry { display: flex; align-items: center; gap: 9px; margin-left: auto; }
.s2-entry-label { font-size: 11.5px; color: var(--text-3); }
.s2-entry-seg, .s2-vswitch-seg, .s2-entry-seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.s2-entry-seg button { border: none; background: transparent; color: var(--text-3); font-size: 12.5px; padding: 4px 11px; border-radius: 999px; }
.s2-entry-seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.16); }

.s2-scroll { flex: 1; overflow-y: auto; }
.s2-thread { max-width: 740px; margin: 0 auto; padding: 28px 24px 0; }
.s2-thread-pad { height: 24px; }

/* messages */
.s2-msg { display: flex; gap: 13px; margin-bottom: 22px; align-items: flex-start; }
.s2-msg-av { width: 28px; height: 28px; border-radius: 999px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 600; margin-top: 1px; }
.s2-msg-av.user { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
.s2-msg-av.bot { background: var(--surface-2); border: 1px solid var(--border); }
.s2-msg-body { flex: 1; min-width: 0; font-size: 15px; line-height: 1.55; padding-top: 3px; color: var(--text); }
.s2-msg.user .s2-msg-body { color: var(--text); }

.s2-typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
.s2-typing span { width: 6px; height: 6px; border-radius: 999px; background: var(--text-3); animation: s2blink 1.2s infinite both; }
.s2-typing span:nth-child(2) { animation-delay: .18s; }
.s2-typing span:nth-child(3) { animation-delay: .36s; }
@keyframes s2blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* chips */
.s2-chips-wrap { margin: 2px 0 22px 41px; }
.s2-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.s2-chips.center { justify-content: center; }
.s2-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font-size: 13.5px; font-weight: 500; padding: 8px 14px; border-radius: 999px; }
.s2-chip:hover { background: var(--hover); }
.s2-chip.primary { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: transparent; }
.s2-chip.primary:hover { opacity: .9; }
.s2-chip svg { color: currentColor; }

/* inline trigger / consent card */
.s2-card { display: flex; gap: 13px; border: 1px solid var(--border); background: var(--surface-2); border-radius: var(--r-card); padding: 16px 17px; }
.s2-card-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-2); flex: none; }
.s2-card-icon.sq { border-radius: 9px; }
.s2-card-main { flex: 1; min-width: 0; }
.s2-card-title { font-size: 15px; font-weight: 550; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.s2-card-text { font-size: 14px; color: var(--text-2); line-height: 1.5; }
.s2-card-actions { display: flex; gap: 8px; margin-top: 13px; }
.s2-ro { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; color: var(--text-3); border: 1px solid var(--border); padding: 2px 7px; border-radius: 999px; }

.s2-scopes { display: flex; flex-direction: column; gap: 1px; margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.s2-scope { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; font-size: 13.5px; background: var(--surface); }
.s2-scope-acc { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); font-size: 13px; }
.s2-scope-acc svg { color: var(--accent); }

/* blank-page solve */
.s2-blank { text-align: center; max-width: 460px; margin: 8vh auto 0; padding: 0 20px; }
.s2-blank-bot { width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-2); display: grid; place-items: center; margin: 0 auto 18px; }
.s2-blank-title { font-size: 22px; font-weight: 550; margin-bottom: 8px; letter-spacing: -.01em; }
.s2-blank-text { font-size: 15px; color: var(--text-2); line-height: 1.55; margin-bottom: 22px; }

/* workflow card */
.s2-wfcard { border: 1px solid var(--border); background: var(--surface-2); border-radius: var(--r-card); overflow: hidden; }
.s2-wfcard-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 16px 13px; }
.s2-wfcard-head-l { display: flex; align-items: center; gap: 12px; }
.s2-wfcard-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.s2-wfcard-meta { padding: 4px 16px 6px; }
.s2-wfcard-row { display: flex; gap: 14px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
.s2-wfcard-row:first-child { border-top: none; }
.s2-wfcard-k { width: 86px; flex: none; color: var(--text-3); }
.s2-wfcard-v { color: var(--text); }
.s2-wfcard-foot { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--border); background: var(--surface); }
.s2-wfcard-note { font-size: 12px; color: var(--text-3); }
.s2-spin { width: 14px; height: 14px; border-radius: 999px; border: 2px solid currentColor; border-right-color: transparent; animation: s2spin .7s linear infinite; }
@keyframes s2spin { to { transform: rotate(360deg); } }

/* value variant switch */
.s2-vswitch { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.s2-vswitch-label { font-size: 11.5px; color: var(--text-3); }
.s2-vswitch-seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.s2-vswitch-seg button { width: 26px; height: 22px; border: none; background: transparent; color: var(--text-3); font-size: 12px; font-weight: 600; border-radius: 999px; }
.s2-vswitch-seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.16); }

/* ===== value panel ===== */
.vp-wrap { border: 1px solid var(--border); background: var(--surface-2); border-radius: var(--r-card); padding: 17px 18px 18px; }
.vp-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.vp-title { font-size: 15px; font-weight: 550; }
.vp-head-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.vp-label { font-size: 12px; color: var(--text-3); margin-bottom: 7px; }
.vp-num { font-size: 30px; font-weight: 580; letter-spacing: -.02em; line-height: 1; display: flex; align-items: baseline; gap: 6px; }
.vp-num.accent { color: var(--accent-text); }
.vp-unit { font-size: 13px; font-weight: 500; color: var(--text-3); letter-spacing: 0; }
.vp-unit.sm { font-size: 12px; margin-left: 5px; }
.accent .vp-unit { color: var(--accent-text); opacity: .7; }
.vp-sub { font-size: 12.5px; color: var(--text-3); margin-top: 9px; }
.vp-foot { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.vp-foot.tight { margin-top: 12px; padding-top: 0; border: none; }
.vp-foot svg { color: var(--text-3); flex: none; }
.vp-foot b { font-weight: 600; color: var(--text); }

/* variant A */
.vp-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 14px; }
.vp-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: var(--surface); }
.vp-card .vp-num { margin-bottom: 12px; }

/* variant B */
.vp-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.vp-hero-num { font-size: 46px; font-weight: 600; letter-spacing: -.02em; line-height: 1; display: flex; align-items: baseline; gap: 8px; margin: 4px 0 0; }
.vp-hero-r { text-align: right; }
.vp-trend { font-size: 12px; color: var(--accent-text); display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; }
.vp-rowstats { display: flex; gap: 26px; margin-top: 15px; font-size: 13.5px; color: var(--text-2); }
.vp-rowstats span { font-weight: 600; color: var(--text); }

/* variant C */
.vp-line { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--border); }
.vp-line:first-child { border-top: none; padding-top: 2px; }
.vp-line-label { font-size: 13.5px; color: var(--text-2); }
.vp-line-spark { margin-left: auto; }
.vp-line-val { margin-left: auto; font-size: 17px; font-weight: 580; display: flex; align-items: baseline; }
.vp-line-spark + .vp-line-val { margin-left: 14px; }
.vp-line-val.accent { color: var(--accent-text); }

/* consumption bar (shared, used in cards if needed) */
.vp-consume-bar { height: 7px; border-radius: 999px; background: var(--surface); position: relative; overflow: hidden; }
.vp-consume-fill { position: absolute; inset: 0; background: var(--border-strong); }
.vp-consume-over { position: absolute; top: 0; bottom: 0; right: 0; background: var(--warn); }
.vp-consume-key { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--text-3); }
.vp-consume-key .k { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.vp-consume-key .k-base { background: var(--border-strong); }
.vp-consume-key .k-over { background: var(--warn); }

/* composer */
.s2-composer-wrap { flex: none; padding: 6px 24px 16px; }
.s2-composer { max-width: 740px; margin: 0 auto; border: 1px solid var(--border-strong); background: var(--surface-2); border-radius: 26px; padding: 6px 8px 8px 18px; box-shadow: var(--shadow-pop); }
.s2-input { width: 100%; border: none; background: transparent; color: var(--text); font-family: inherit; font-size: 15px; padding: 10px 0 8px; outline: none; }
.s2-input::placeholder { color: var(--text-3); }
.s2-composer-bar { display: flex; align-items: center; justify-content: space-between; }
.s2-composer-right { display: flex; align-items: center; gap: 6px; }
.s2-comp-btn { width: 34px; height: 34px; border-radius: 999px; border: none; background: transparent; color: var(--text-2); display: grid; place-items: center; }
.s2-comp-btn:hover { background: var(--hover); color: var(--text); }
.s2-send { width: 34px; height: 34px; border-radius: 999px; border: none; background: var(--btn-primary-bg); color: var(--btn-primary-fg); display: grid; place-items: center; }
.s2-send:hover { opacity: .9; }
.s2-disclaim { max-width: 740px; margin: 9px auto 0; text-align: center; font-size: 11.5px; color: var(--text-3); }

.s2-brand { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.s2-side-foot-wrap { border-top: 1px solid var(--border); padding: 8px 8px 10px; }
.s2-side-foot { border-top: none; padding: 6px 6px 8px; }
.s2-side-foot .s2-acct { flex: 1; }
.s2-invite { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 1px solid var(--border-strong); background: transparent; color: var(--text); font-family: inherit; font-size: 13.5px; font-weight: 500; padding: 9px 12px; border-radius: 999px; cursor: pointer; }
.s2-invite:hover { background: var(--hover); }
.s2-invite svg { color: var(--text-2); }

/* demo entry-point switcher: left-aligned so it never sits under the top-right controls, and amber-tinted so it clearly reads as a demo control */
.s2-entry { margin-left: 0; }
.s2-topbar { padding-right: 260px; }
.s2-entry-label { color: var(--warn); font-weight: 600; }
.s2-entry-seg { background: var(--warn-fill); border: 1px solid var(--warn); }
.s2-entry-seg button { color: var(--text-2); }
.s2-entry-seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.18); }

@media (max-width: 820px) {
  .s2-side { display: none; }
  .s2-entry-label { display: none; }
}
</style>
</head>
<body>
<div class="theme-toggle">
  <a class="screen-link" href="operator-console.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h5l2 3h4l2-3h5"/><path d="M5 5h14l2 7v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Z"/></svg>Operator console</a>
  <div class="seg" id="themeSeg">
    <button data-t="light" title="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg></button>
    <button data-t="dark" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8 8 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z"/></svg></button>
  </div>
</div>

<div id="root"></div>

<script>
  (function () {
    const root = document.documentElement;
    const saved = localStorage.getItem("cla-theme") || "dark";
    root.setAttribute("data-theme", saved);
    const seg = document.getElementById("themeSeg");
    function sync() {
      const t = root.getAttribute("data-theme");
      seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    }
    seg.addEventListener("click", function (e) {
      const b = e.target.closest("button"); if (!b) return;
      root.setAttribute("data-theme", b.dataset.t);
      localStorage.setItem("cla-theme", b.dataset.t);
      sync();
    });
    sync();
  })();
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
